<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aulão de Revisão - Provão Paulista 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
        }
        h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 2.5em; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 1.2em; }
        .school { text-align: center; color: #555; margin-bottom: 40px; font-weight: 600; }
        .instruction {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 1.1em;
            font-weight: 500;
        }
        .subject-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .subject-card {
            padding: 50px 30px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 5px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .subject-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }
        .subject-card.selected {
            border: 5px solid #FFD700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            transform: translateY(-5px) scale(1.03);
        }
        .subject-card.selected::after {
            content: "✓ SELECIONADO";
            position: absolute;
            top: 15px;
            right: 15px;
            background: #FFD700;
            color: #333;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .philosophy {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .sociology {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
            color: white;
        }
        .subject-card h2 { font-size: 2.2em; margin-bottom: 15px; }
        .subject-card p { font-size: 1.1em; opacity: 0.95; }
        .subject-card .icon { font-size: 4em; margin-bottom: 20px; display: block; }
        .footer-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            text-align: center;
            color: #888;
            font-size: 0.9em;
        }
        .footer-info a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        @media (max-width: 768px) {
            .subject-selection { grid-template-columns: 1fr; }
            h1 { font-size: 1.8em; }
            .subject-card h2 { font-size: 1.6em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 AULÃO DE REVISÃO</h1>
        <h2 class="subtitle">PROVÃO PAULISTA 2026</h2>
        <div class="school">
            E.E. Prof. Esli Garcia Diniz<br>
            Professor Vitor Piedade
        </div>

        <p class="instruction">👇 Escolha a disciplina que deseja revisar:</p>

        <div class="subject-selection">
            <div class="subject-card philosophy" onclick="selectSubject('filosofia', this)">
                <span class="icon">🏛️</span>
                <h2>FILOSOFIA</h2>
                <p>12 aulas de revisão com questões do ENEM</p>
            </div>
            <div class="subject-card sociology" onclick="selectSubject('sociologia', this)">
                <span class="icon">👥</span>
                <h2>SOCIOLOGIA</h2>
                <p>12 aulas de revisão com questões do ENEM</p>
            </div>
        </div>

        <div class="footer-info">
            <a href="admin.html">📊 Área do Professor (ver resultados)</a>
        </div>
    </div>

    <script>
        function selectSubject(subject, element) {
            // Remove seleção de todos
            document.querySelectorAll('.subject-card').forEach(card => {
                card.classList.remove('selected');
            });
            // Adiciona seleção ao clicado
            element.classList.add('selected');
            
            // Salva e redireciona após pequeno delay para mostrar a animação
            setTimeout(() => {
                localStorage.setItem('selectedSubject', subject);
                window.location.href = `aulas-${subject}.html`;
            }, 400);
        }
    </script>
</body>
</html>
