<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Provão Paulista 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; min-height: 100vh; }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px 20px; text-align: center; }
        header.sociologia { background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%); }
        header h1 { font-size: 1.8em; margin-bottom: 10px; }
        .header-btns { margin-top: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .header-btn { display: inline-block; padding: 10px 25px; background: white; color: #667eea; text-decoration: none; border-radius: 25px; font-weight: 600; transition: transform 0.3s; }
        .header-btn.sociologia { color: #56ab2f; }
        .header-btn:hover { transform: scale(1.05); }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .form-container, .quiz-container, .result-container { background: white; border-radius: 15px; padding: 40px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { color: #667eea; margin-bottom: 25px; font-size: 1.6em; }
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input, select { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        .btn { display: block; width: 100%; padding: 18px; background: #667eea; color: white; border: none; border-radius: 10px; font-size: 1.1em; font-weight: 600; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn.sociologia { background: #56ab2f; }
        .btn:hover { background: #5568d3; }
        .btn.sociologia:hover { background: #4a9528; }
        .btn:disabled { background: #999; cursor: not-allowed; }
        .btn-secondary { background: #95a5a6; }
        .btn-secondary:hover { background: #7f8c8d; }
        .error-msg { background: #ffebee; color: #c62828; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #c62828; display: none; }
        .error-msg.show { display: block; }
        .success-msg { background: #e8f5e9; color: #2e7d32; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #2e7d32; display: none; }
        .success-msg.show { display: block; }
        .question { margin-bottom: 35px; padding-bottom: 25px; border-bottom: 2px solid #eee; }
        .question:last-of-type { border-bottom: none; }
        .question-text { font-size: 1.1em; color: #333; margin-bottom: 20px; font-weight: 600; line-height: 1.5; }
        .options label { display: block; padding: 15px; background: #f8f9ff; border: 2px solid #e8ecff; border-radius: 8px; margin-bottom: 12px; cursor: pointer; transition: all 0.3s; font-weight: normal; }
        .options label:hover { background: #e8ecff; border-color: #667eea; }
        .options input[type="radio"] { margin-right: 12px; width: auto; }
        .hidden { display: none; }
        .result-box { text-align: center; padding: 30px; }
        .score { font-size: 4em; color: #667eea; font-weight: bold; margin: 20px 0; }
        .score.sociologia { color: #56ab2f; }
        .message { font-size: 1.3em; color: #444; margin-bottom: 30px; }
        .correction { text-align: left; margin-top: 30px; padding: 25px; background: #f8f9ff; border-radius: 10px; }
        .correction h3 { color: #667eea; margin-bottom: 20px; }
        .question-correction { margin-bottom: 25px; padding: 20px; background: white; border-radius: 8px; border-left: 4px solid #667eea; }
        .question-correction.correct { border-left-color: #56ab2f; }
        .question-correction.incorrect { border-left-color: #e74c3c; }
        .question-correction strong { color: #333; display: block; margin-bottom: 10px; }
        .correct-answer { color: #56ab2f; font-weight: 600; }
        .user-answer { color: #e74c3c; font-weight: 600; }
        .explanation { margin-top: 10px; padding: 12px; background: #f5f7fa; border-radius: 5px; font-size: 0.95em; color: #555; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header id="header">
        <h1 id="title">📝 Quiz</h1>
        <p id="subtitle">Teste seus conhecimentos</p>
        <div class="header-btns">
            <a href="index.html" class="header-btn" id="homeBtn">🏠 Voltar ao Início</a>
            <a href="#" class="header-btn" id="backToListBtn">← Voltar às Aulas</a>
        </div>
    </header>

    <div class="container">
        <!-- Formulário Inicial -->
        <div class="form-container" id="formContainer">
            <h2>📋 Identificação do Estudante</h2>
            <p style="margin-bottom: 25px; color: #666;">Preencha os dados abaixo para iniciar o quiz:</p>
            
            <div class="error-msg" id="errorMsg"></div>

            <div class="form-group">
                <label for="studentName">Nome Completo *</label>
                <input type="text" id="studentName" required placeholder="Digite seu nome completo">
            </div>

            <div class="form-group">
                <label for="studentClass">Turma *</label>
                <select id="studentClass" required>
                    <option value="">Selecione sua turma</option>
                    <optgroup label="1ª Série">
                        <option value="1A">1A</option><option value="1B">1B</option><option value="1C">1C</option><option value="1D">1D</option><option value="1E">1E</option>
                    </optgroup>
                    <optgroup label="2ª Série">
                        <option value="2A">2A</option><option value="2B">2B</option><option value="2C">2C</option><option value="2D">2D</option><option value="2E">2E</option>
                    </optgroup>
                    <optgroup label="3ª Série">
                        <option value="3A">3A</option><option value="3B">3B</option><option value="3C">3C</option><option value="3D">3D</option><option value="3F">3F</option>
                    </optgroup>
                </select>
            </div>

            <button type="button" class="btn" id="startBtn" onclick="startQuiz()">Iniciar Quiz</button>
            <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">🏠 Voltar ao Início</button>
        </div>

        <!-- Quiz -->
        <div class="quiz-container hidden" id="quizContainer">
            <h2 id="quizTitle">Questões</h2>
            <div id="questionsContainer"></div>
            <div class="error-msg" id="quizErrorMsg"></div>
            <button type="button" class="btn" id="submitBtn" onclick="submitQuiz()">Finalizar Quiz</button>
        </div>

        <!-- Resultado -->
        <div class="result-container hidden" id="resultContainer">
            <div class="result-box">
                <h2>📊 Resultado do Quiz</h2>
                <div class="score" id="scoreDisplay">0/5</div>
                <div class="message" id="messageDisplay"></div>
                <div id="saveStatus" class="success-msg"></div>
                <div class="correction" id="correctionContainer">
                    <h3>📖 Correção Detalhada</h3>
                    <div id="corrections"></div>
                </div>
                <a href="#" id="backToLesson" class="btn" style="display:inline-block;width:auto;margin-top:20px;">← Voltar à Aula</a>
                <a href="#" id="backToList" class="btn btn-secondary" style="display:inline-block;width:auto;margin-top:20px;margin-left:10px;">Ver Outras Aulas</a>
            </div>
        </div>
    </div>

    <script src="dados-aulas.js"></script>
    <script>
        // ⚠️ IMPORTANTE: Cole aqui a URL do seu Apps Script (a que termina em /exec)
        // Se não quiser usar o Google Sheets, deixe como está (funciona só com localStorage)
        const GOOGLE_SCRIPT_URL = ''; // Ex: 'https://script.google.com/macros/s/AKfycbw8gl706UfeInLDaeH-VmrR_u9mKn_UjEmikvcAziafoYj_R2wx1AXv6rWKRZf5q4bp/exec'

        // Verifica se os dados foram carregados
        if (typeof dadosAulas === 'undefined') {
            document.body.innerHTML = `
                <div style="text-align:center;padding:50px;">
                    <h1 style="color:#e74c3c;">⚠️ Erro ao carregar</h1>
                    <p style="margin:20px 0;">Não foi possível carregar as questões do quiz.</p>
                    <p style="margin:20px 0;">Verifique se o arquivo <strong>dados-aulas.js</strong> está presente no repositório.</p>
                    <a href="index.html" style="display:inline-block;padding:15px 30px;background:#667eea;color:white;text-decoration:none;border-radius:25px;font-weight:600;margin-top:20px;">Voltar ao Início</a>
                </div>
            `;
        } else {
            inicializarQuiz();
        }

        function inicializarQuiz() {
            const urlParams = new URLSearchParams(window.location.search);
            const materia = urlParams.get('materia');
            const aulaNum = parseInt(urlParams.get('aula'));
            const isSociologia = materia === 'sociologia';

            if (!materia || !aulaNum || !dadosAulas[materia] || !dadosAulas[materia][aulaNum]) {
                document.body.innerHTML = `
                    <div style="text-align:center;padding:50px;">
                        <h1 style="color:#e74c3c;">⚠️ Aula não encontrada</h1>
                        <p style="margin:20px 0;">Verifique o link e tente novamente.</p>
                        <a href="index.html" style="display:inline-block;padding:15px 30px;background:#667eea;color:white;text-decoration:none;border-radius:25px;font-weight:600;">Voltar ao Início</a>
                    </div>
                `;
                return;
            }

            const aula = dadosAulas[materia][aulaNum];
            document.getElementById('title').textContent = `📝 Quiz - Aula ${aulaNum}`;
            document.getElementById('subtitle').textContent = aula.titulo;
            document.getElementById('quizTitle').textContent = `Questões - ${aula.titulo}`;
            document.getElementById('backToLesson').href = `aula.html?materia=${materia}&aula=${aulaNum}`;
            document.getElementById('backToList').href = `aulas-${materia}.html`;
            document.getElementById('backToListBtn').href = `aulas-${materia}.html`;

            if (isSociologia) {
                document.getElementById('header').classList.add('sociologia');
                document.getElementById('startBtn').classList.add('sociologia');
                document.getElementById('submitBtn').classList.add('sociologia');
                document.getElementById('scoreDisplay').classList.add('sociologia');
                document.getElementById('backToLesson').classList.add('sociologia');
                document.getElementById('backToList').classList.add('sociologia');
                document.getElementById('backToListBtn').classList.add('sociologia');
                document.getElementById('homeBtn').classList.add('sociologia');
            }
        }

        let studentData = {};
        let currentQuestions = [];

        function showError(elementId, message) {
            const errorDiv = document.getElementById(elementId);
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 4000);
        }

        function startQuiz() {
            const name = document.getElementById('studentName').value.trim();
            const classSelected = document.getElementById('studentClass').value;

            if (!name || name.length < 3) {
                showError('errorMsg', '⚠️ Por favor, preencha seu nome completo (mínimo 3 caracteres).');
                return;
            }
            if (!classSelected) {
                showError('errorMsg', '⚠️ Por favor, selecione sua turma.');
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const materia = urlParams.get('materia');
            const aulaNum = parseInt(urlParams.get('aula'));

            studentData = {
                name: name,
                class: classSelected,
                materia: materia,
                aula: aulaNum,
                date: new Date().toLocaleString('pt-BR')
            };

            // Embaralha as alternativas
            const questoesOriginais = dadosAulas[materia][aulaNum].quiz;
            currentQuestions = questoesOriginais.map(q => {
                const alternativas = [
                    { letra: 'a', texto: q.alternativas.a },
                    { letra: 'b', texto: q.alternativas.b },
                    { letra: 'c', texto: q.alternativas.c },
                    { letra: 'd', texto: q.alternativas.d },
                    { letra: 'e', texto: q.alternativas.e }
                ];
                
                for (let i = alternativas.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [alternativas[i], alternativas[j]] = [alternativas[j], alternativas[i]];
                }
                
                const novaLetraCorreta = alternativas.find(a => a.letra === q.correta).letra;
                const novasLetras = ['a', 'b', 'c', 'd', 'e'];
                const novasAlternativas = {};
                alternativas.forEach((alt, idx) => {
                    novasAlternativas[novasLetras[idx]] = alt.texto;
                });
                
                return {
                    enunciado: q.enunciado,
                    alternativas: novasAlternativas,
                    correta: novaLetraCorreta,
                    explicacao: q.explicacao
                };
            });

            let html = '';
            currentQuestions.forEach((q, idx) => {
                html += `<div class="question"><div class="question-text"><strong>Questão ${idx + 1}:</strong> ${q.enunciado}</div><div class="options">`;
                ['a', 'b', 'c', 'd', 'e'].forEach(letra => {
                    html += `<label><input type="radio" name="q${idx}" value="${letra}"> ${letra}) ${q.alternativas[letra]}</label>`;
                });
                html += `</div></div>`;
            });
            document.getElementById('questionsContainer').innerHTML = html;

            document.getElementById('formContainer').classList.add('hidden');
            document.getElementById('quizContainer').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        async function enviarParaPlanilha(resultado) {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === '') {
                console.log('Google Sheets não configurado, usando apenas localStorage');
                return false;
            }
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(resultado)
                });
                return true;
            } catch(error) {
                console.error('Erro ao enviar:', error);
                return false;
            }
        }

        async function submitQuiz() {
            const answers = {};
            for (let i = 0; i < currentQuestions.length; i++) {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                if (!selected) {
                    showError('quizErrorMsg', `⚠️ Por favor, responda a questão ${i + 1} antes de finalizar.`);
                    return;
                }
                answers[`q${i}`] = selected.value;
            }

            let score = 0;
            const corrections = [];

            currentQuestions.forEach((q, idx) => {
                const userAnswer = answers[`q${idx}`];
                const isCorrect = userAnswer === q.correta;
                if (isCorrect) score++;
                corrections.push({
                    question: idx + 1,
                    enunciado: q.enunciado,
                    userAnswer,
                    correctAnswer: q.correta,
                    userText: q.alternativas[userAnswer],
                    correctText: q.alternativas[q.correta],
                    isCorrect,
                    explanation: q.explicacao
                });
            });

            const resultado = {
                ...studentData,
                score: score,
                totalQuestions: currentQuestions.length,
                percentage: Math.round((score / currentQuestions.length) * 100),
                timestamp: new Date().toISOString()
            };

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> Salvando...';

            const enviado = await enviarParaPlanilha(resultado);

            let allResults = JSON.parse(localStorage.getItem('quizResults') || '[]');
            allResults.push(resultado);
            localStorage.setItem('quizResults', JSON.stringify(allResults));

            displayResults(score, corrections, enviado);
        }

        function displayResults(score, corrections, enviado) {
            document.getElementById('quizContainer').classList.add('hidden');
            document.getElementById('resultContainer').classList.remove('hidden');

            document.getElementById('scoreDisplay').textContent = `${score}/${currentQuestions.length}`;

            let message = '';
            if (score === currentQuestions.length) message = '🏆 Excelente! Você dominou o conteúdo!';
            else if (score >= 3) message = '👍 Bom trabalho! Revise os erros para aperfeiçoar.';
            else message = '📚 Continue estudando! Revise a aula e tente novamente.';
            document.getElementById('messageDisplay').textContent = message;

            const saveStatus = document.getElementById('saveStatus');
            if (GOOGLE_SCRIPT_URL && enviado) {
                saveStatus.textContent = '✅ Seu resultado foi registrado com sucesso!';
                saveStatus.classList.add('show');
            } else if (GOOGLE_SCRIPT_URL) {
                saveStatus.textContent = '⚠️ Não foi possível enviar para a planilha, mas suas respostas foram registradas.';
                saveStatus.style.background = '#fff3cd';
                saveStatus.style.color = '#856404';
                saveStatus.style.borderLeftColor = '#ffc107';
                saveStatus.classList.add('show');
            }

            let correctionsHTML = '';
            corrections.forEach(corr => {
                const statusClass = corr.isCorrect ? 'correct' : 'incorrect';
                const statusIcon = corr.isCorrect ? '✅' : '❌';
                
                correctionsHTML += `
                    <div class="question-correction ${statusClass}">
                        <strong>${statusIcon} Questão ${corr.question}</strong>
                        <p style="margin-bottom:10px;color:#555;font-style:italic;">${corr.enunciado}</p>
                        <p>${corr.isCorrect ? 
                            `<span class="correct-answer">Sua resposta: ${corr.userAnswer}) ${corr.userText} - CORRETA</span>` : 
                            `<span class="user-answer">Sua resposta: ${corr.userAnswer}) ${corr.userText} - ERRADA</span><br>
                             <span class="correct-answer">Resposta correta: ${corr.correctAnswer}) ${corr.correctText}</span>`
                        }</p>
                        <div class="explanation"><strong>Explicação:</strong> ${corr.explanation}</div>
                    </div>
                `;
            });
            document.getElementById('corrections').innerHTML = correctionsHTML;
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
