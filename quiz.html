<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Provão Paulista 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        header.sociologia {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
        }
        header h1 { font-size: 1.8em; margin-bottom: 10px; }
        header p { font-size: 1em; opacity: 0.95; }
        .header-btns {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .header-btn {
            display: inline-block;
            padding: 10px 20px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9em;
            transition: transform 0.3s;
        }
        .header-btn.sociologia { color: #56ab2f; }
        .header-btn:hover { transform: scale(1.05); }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-container, .quiz-container, .result-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.4em;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
        }
        .btn.sociologia { background: #56ab2f; }
        .btn:hover { background: #5568d3; }
        .btn.sociologia:hover { background: #4a9528; }
        .btn:disabled { background: #999; cursor: not-allowed; }
        .btn-secondary { background: #95a5a6; }
        .btn-secondary:hover { background: #7f8c8d; }
        .error-msg {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #c62828;
            display: none;
        }
        .error-msg.show { display: block; }
        .success-msg {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #2e7d32;
            display: none;
        }
        .success-msg.show { display: block; }
        .warning-msg {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #ffc107;
            display: none;
        }
        .warning-msg.show { display: block; }
        .question {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .question:last-of-type { border-bottom: none; }
        .question-text {
            font-size: 1em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
            line-height: 1.5;
        }
        .options label {
            display: block;
            padding: 12px;
            background: #f8f9ff;
            border: 2px solid #e8ecff;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: normal;
            font-size: 0.95em;
            line-height: 1.4;
        }
        .options label:hover {
            background: #e8ecff;
            border-color: #667eea;
        }
        .options input[type="radio"] {
            margin-right: 10px;
            width: auto;
        }
        .hidden { display: none; }
        .result-box { text-align: center; padding: 20px; }
        .score {
            font-size: 3em;
            color: #667eea;
            font-weight: bold;
            margin: 15px 0;
        }
        .score.sociologia { color: #56ab2f; }
        .message {
            font-size: 1.1em;
            color: #444;
            margin-bottom: 20px;
        }
        .correction {
            text-align: left;
            margin-top: 20px;
            padding: 20px 15px;
            background: #f8f9ff;
            border-radius: 10px;
        }
        .correction h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        .question-correction {
            margin-bottom: 15px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .question-correction.correct { border-left-color: #56ab2f; }
        .question-correction.incorrect { border-left-color: #e74c3c; }
        .question-correction strong {
            color: #333;
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        .question-correction p {
            font-size: 0.85em;
            line-height: 1.4;
            margin-bottom: 5px;
        }
        .correct-answer { color: #56ab2f; font-weight: 600; font-size: 0.85em; }
        .user-answer { color: #e74c3c; font-weight: 600; font-size: 0.85em; }
        .explanation {
            margin-top: 8px;
            padding: 8px;
            background: #f5f7fa;
            border-radius: 5px;
            font-size: 0.8em !important;
            color: #555;
            line-height: 1.4;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .btn-group .btn {
            flex: 1;
            min-width: 150px;
        }
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== RESPONSIVIDADE MOBILE ===== */
        @media (max-width: 768px) {
            header { padding: 20px 15px; }
            header h1 { font-size: 1.3em; }
            header p { font-size: 0.85em; }
            .header-btn { padding: 8px 15px; font-size: 0.8em; }
            .container { padding: 15px; }
            .form-container, .quiz-container, .result-container { padding: 20px 15px; }
            h2 { font-size: 1.2em; }
            .question-text { font-size: 0.95em; }
            .options label { padding: 10px; font-size: 0.9em; }
            .btn { padding: 12px; font-size: 0.95em; }
            .score { font-size: 2.2em; margin: 10px 0; }
            .message { font-size: 0.95em; }
            .correction { padding: 15px 10px; }
            .correction h3 { font-size: 1em; }
            .question-correction { padding: 10px; margin-bottom: 12px; }
            .question-correction strong { font-size: 0.85em; }
            .question-correction p { font-size: 0.82em; }
            .explanation { font-size: 0.75em !important; padding: 6px; }
            .btn-group { flex-direction: column; }
            .btn-group .btn { min-width: 100%; margin: 0 !important; }
        }
        @media (max-width: 400px) {
            .form-container, .quiz-container, .result-container { padding: 15px 10px; }
            .score { font-size: 2em; }
            .question-correction { padding: 8px; }
        }
    </style>
</head>
<body>
    <header id="header">
        <h1 id="title">📝 Quiz</h1>
        <p id="subtitle">Teste seus conhecimentos</p>
        <div class="header-btns">
            <a href="index.html" class="header-btn" id="homeBtn">🏠 Início</a>
            <a href="#" class="header-btn" id="backToListBtn">← Voltar às Aulas</a>
        </div>
    </header>

    <div class="container">
        <!-- FORMULÁRIO DE IDENTIFICAÇÃO -->
        <div class="form-container" id="formContainer">
            <h2>📋 Identificação do Estudante</h2>
            <p style="margin-bottom: 20px; color: #666;">Preencha os dados abaixo para iniciar o quiz:</p>

            <div class="error-msg" id="errorMsg"></div>

            <div class="form-group">
                <label for="studentName">Nome Completo *</label>
                <input type="text" id="studentName" required placeholder="Digite seu nome completo">
            </div>

            <div class="form-group">
                <label for="studentClass">Turma *</label>
                <select id="studentClass" required>
                    <option value="">Selecione sua turma</option>
                    <optgroup label="1ª Série">
                        <option value="1A">1A</option>
                        <option value="1B">1B</option>
                        <option value="1C">1C</option>
                        <option value="1D">1D</option>
                        <option value="1E">1E</option>
                    </optgroup>
                    <optgroup label="2ª Série">
                        <option value="2A">2A</option>
                        <option value="2B">2B</option>
                        <option value="2C">2C</option>
                        <option value="2D">2D</option>
                        <option value="2E">2E</option>
                    </optgroup>
                    <optgroup label="3ª Série">
                        <option value="3A">3A</option>
                        <option value="3B">3B</option>
                        <option value="3C">3C</option>
                        <option value="3D">3D</option>
                        <option value="3F">3F</option>
                    </optgroup>
                </select>
            </div>

            <button type="button" class="btn" id="startBtn" onclick="startQuiz()">Iniciar Quiz</button>
            <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">🏠 Voltar ao Início</button>
        </div>

        <!-- QUIZ -->
        <div class="quiz-container hidden" id="quizContainer">
            <h2 id="quizTitle">Questões</h2>
            <div id="questionsContainer"></div>
            <div class="error-msg" id="quizErrorMsg"></div>
            <button type="button" class="btn" id="submitBtn" onclick="submitQuiz()">Finalizar Quiz</button>
        </div>

        <!-- RESULTADO -->
        <div class="result-container hidden" id="resultContainer">
            <div class="result-box">
                <h2>📊 Resultado do Quiz</h2>
                <div class="score" id="scoreDisplay">0/5</div>
                <div class="message" id="messageDisplay"></div>
                <div id="saveStatus"></div>
                <div class="correction" id="correctionContainer">
                    <h3>📖 Correção Detalhada</h3>
                    <div id="corrections"></div>
                </div>
                <div class="btn-group">
                    <a href="#" id="backToLesson" class="btn">← Voltar à Aula</a>
                    <a href="#" id="backToList" class="btn btn-secondary">Ver Outras Aulas</a>
                </div>
            </div>
        </div>
    </div>

    <script src="dados-aulas.js"></script>
    <script>
        // ============================================================
        // CONFIGURAÇÃO - COLE SUA URL DO APPS SCRIPT AQUI:
        // ============================================================
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8gl706UfeInLDaeH-VmrR_u9mKn_UjEmikvcAziafoYj_R2wx1AXv6rWKRZf5q4bp/exec';

        // ============================================================
        // VERIFICAÇÃO INICIAL
        // ============================================================
        if (typeof dadosAulas === 'undefined') {
            document.body.innerHTML = `
                <div style="text-align:center;padding:50px;">
                    <h1 style="color:#e74c3c;">⚠️ Erro ao carregar</h1>
                    <p style="margin:20px 0;">Não foi possível carregar as questões do quiz.</p>
                    <p style="margin:20px 0;">Verifique se o arquivo <strong>dados-aulas.js</strong> está presente no repositório.</p>
                    <a href="index.html" style="display:inline-block;padding:15px 30px;background:#667eea;color:white;text-decoration:none;border-radius:25px;font-weight:600;margin-top:20px;">Voltar ao Início</a>
                </div>
            `;
        } else {
            inicializarQuiz();
        }

        function inicializarQuiz() {
            const urlParams = new URLSearchParams(window.location.search);
            const materia = urlParams.get('materia');
            const aulaNum = parseInt(urlParams.get('aula'));
            const isSociologia = materia === 'sociologia';

            if (!materia || !aulaNum || !dadosAulas[materia] || !dadosAulas[materia][aulaNum]) {
                document.body.innerHTML = `
                    <div style="text-align:center;padding:50px;">
                        <h1 style="color:#e74c3c;">⚠️ Aula não encontrada</h1>
                        <p style="margin:20px 0;">Verifique o link e tente novamente.</p>
                        <a href="index.html" style="display:inline-block;padding:15px 30px;background:#667eea;color:white;text-decoration:none;border-radius:25px;font-weight:600;">Voltar ao Início</a>
                    </div>
                `;
                return;
            }

            const aula = dadosAulas[materia][aulaNum];
            document.getElementById('title').textContent = `📝 Quiz - Aula ${aulaNum}`;
            document.getElementById('subtitle').textContent = aula.titulo;
            document.getElementById('quizTitle').textContent = `Questões - ${aula.titulo}`;
            document.getElementById('backToLesson').href = `aula.html?materia=${materia}&aula=${aulaNum}`;
            document.getElementById('backToList').href = `aulas-${materia}.html`;
            document.getElementById('backToListBtn').href = `aulas-${materia}.html`;

            if (isSociologia) {
                document.getElementById('header').classList.add('sociologia');
                document.getElementById('startBtn').classList.add('sociologia');
                document.getElementById('submitBtn').classList.add('sociologia');
                document.getElementById('scoreDisplay').classList.add('sociologia');
                document.getElementById('backToLesson').classList.add('sociologia');
                document.getElementById('backToList').classList.add('sociologia');
                document.getElementById('backToListBtn').classList.add('sociologia');
                document.getElementById('homeBtn').classList.add('sociologia');
            }
        }

        let studentData = {};
        let currentQuestions = [];

        function showError(elementId, message) {
            const errorDiv = document.getElementById(elementId);
            errorDiv.textContent = message;
            errorDiv.classList.add
